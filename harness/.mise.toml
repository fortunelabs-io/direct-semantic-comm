# Harness v1: tool pinning and task isolation.
#
# Task names below are the commands the Stage 0 gates are stated against in
# ../todos/stage0_todo.md. Each maps to a capture script that does not exist
# yet. Running one now fails loudly with "no such file", which is the intended
# behaviour: a gate cannot pass because its script is missing.
#
# Order is enforced by data dependency, not here. Each capture script refuses to
# start when the file it reads is absent.
#
# Every task invokes .venv/bin/python explicitly rather than relying on `python`
# resolving through PATH. This is not style. mise sets VIRTUAL_ENV for a task
# but does not guarantee this venv's bin directory reaches the front of an
# inherited PATH, and on this machine ~/.mise.toml activates a second venv at
# the home directory that wins. That venv also carries numpy, pandas and
# matplotlib, so a gate would have imported successfully, produced a
# well-formed result, and been wrong about which versions made it. The
# interpreter a measurement ran under is part of the measurement.

[tools]
python = "3.12"
# esp-idf: pinned to the version the Stage -1 contract declares. Pinning it here
# is what turns that declaration into something enforced rather than asserted.
# OPEN: the contract names ESP-IDF v5.x without a patch level.
#
# Capture engine toolchain: arm-none-eabi-gcc, cmake, ninja and st-flash. No
# CubeMX and no vendor HAL, per
# docs/adr/2026-08-12-capture-engine-firmware-is-bare-metal.md.
#
# Family decided in docs/adr/2026-08-09-capture-engine-is-stm32-part-still-open.md
# on sourcing and established skill, not on capability: RP2040 met the four
# requirements too. The part is fixed to STM32F411CEU6 by
# docs/adr/2026-08-12-capture-engine-part-is-stm32f411ceu6.md.
#
# OPEN: arm-none-eabi-gcc is not pinned here yet. It is not installed on this
# machine, so pinning a version would record a claim about a toolchain that has
# never run. The pin lands with the first build that actually happens, and until
# then `mise run toolchain` fails at its preflight rather than silently building
# against whatever the host provides.

[settings]
# Re-enabled locally. ~/workspace/.mise.toml disables attestation verification
# for the projects under it, and this harness inherits that unless it says
# otherwise. A project whose discipline is separating measured from borrowed
# does not silently accept an unverified interpreter.
python.github_attestations = true

[env]
# Auto-activated on entering this directory. Every capture script and every test
# runs against this interpreter and no other, which is what "task isolation"
# means here: a result must not depend on whose shell ran it.
_.python.venv = { path = ".venv", create = true }

# Overrides ~/.mise.toml, which exports PYTHONPATH="{{config_root}}" from the
# home directory and therefore puts $HOME on sys.path ahead of the standard
# library in every shell on this machine. That makes any stray .py file in the
# home directory importable ahead of the real module. Pointing it at this
# directory bounds what is importable to this project.
#
# `mise run doctor` asserts this is still true.
PYTHONPATH = "{{config_root}}"

[tasks.setup]
description = "install pinned host dependencies into the venv"
run = ".venv/bin/python -m pip install -r requirements.txt"

[tasks.doctor]
description = "assert the environment is isolated before trusting any capture"
run = ".venv/bin/python doctor.py"

[tasks.idf]
description = "run idf.py under the ESP-IDF interpreter rather than this venv"
# idf.py carries `#!/usr/bin/env python`, so inside this directory it would run
# under .venv, which has no IDF tooling. The isolation is working as intended
# and this is the seam it needs: the IDF's own interpreter, named explicitly,
# for the same reason every other task names .venv/bin/python explicitly.
# Usage: mise run idf -- build
run = '"$IDF_PYTHON_ENV_PATH/bin/python" "$IDF_PATH/tools/idf.py"'

[tasks.freeze]
description = "re-pin requirements.txt from the current venv, after a deliberate upgrade"
run = ".venv/bin/python -m pip freeze --exclude-editable > requirements.txt"

# --- hardware: the PCB, not a gate ---
#
# None of the five tasks below is a gate. They touch no hardware, write no
# results/*.json, and close nothing in ../todos/stage0_todo.md. A clean ERC and
# a clean DRC are a precondition for spending money on fabrication, not evidence
# about the harness; the Tier 3 gates are what prove the board works.
#
# They run under .venv/bin/python for the same reason every task above does,
# although hardware/check.py imports nothing outside the standard library. The
# thing actually pinned here is kicad-cli, which check.py asserts is on the
# 9.0.x series before it will report anything. .github/workflows/hardware.yml
# runs the identical checker under an identical pin, so "clean at the desk" and
# "clean in CI" are one claim rather than two that happen to agree.

[tasks.erc]
description = "hardware: electrical rules on the schematic"
run = ".venv/bin/python hardware/check.py erc"

[tasks.drc]
description = "hardware: design rules on the layout, and parity with the schematic"
run = ".venv/bin/python hardware/check.py drc"

[tasks.hw]
description = "hardware: erc then drc, both run even if the first fails"
run = ".venv/bin/python hardware/check.py check"

[tasks.fab]
description = "hardware: write Gerbers, drill, position and BOM into hardware/fab/"
run = ".venv/bin/python hardware/check.py fab"

[tasks.fab-parity]
description = "hardware: assert committed fabrication outputs match the board file"
# Run before pushing a harness-v<N>-fab tag. The tag claims ten boards can be
# compared against one commit, and this is what makes that claim checkable.
run = ".venv/bin/python hardware/check.py fab-parity"

[tasks.toolchain]
description = "Tier 0: blink builds and flashes on the selected capture part"
# The part named here is what the specification means by "the part named in
# .mise.toml": STM32F411CEU6, UFQFPN48, LCSC C60420, fixed by
# docs/adr/2026-08-12-capture-engine-part-is-stm32f411ceu6.md.
#
# Two steps, in this order and not collapsed into one. The script captures
# and may prompt; the test is pure, reads the file the script wrote, and is
# silent on success. A gate closes on the test's exit code, so the test has
# to be able to fail on a file the script itself was happy to write.
run = [
    "bash scripts/toolchain.sh",
    ".venv/bin/python tests/test_toolchain.py",
]

# --- Tier 1: capture engine alone, on breakouts ---
[tasks.rate]
description = "7,143 conversion-ready edges per second, within one percent, ten minutes"
run = ".venv/bin/python scripts/capture_rate.py"

[tasks.jitter]
description = "inter-timestamp interval standard deviation under 2 microseconds"
run = ".venv/bin/python scripts/capture_jitter.py"

[tasks.dropped]
description = "zero dropped conversions, both channels, ten minutes"
run = ".venv/bin/python scripts/capture_dropped.py"

[tasks.stream]
description = "114 kilobytes per second to disk with no gaps"
run = ".venv/bin/python scripts/capture_stream.py"

[tasks.wrap]
description = "monotonic timestamps across the 32-bit microsecond wrap"
run = ".venv/bin/python scripts/capture_wrap.py"

# --- Tier 2: device under test, still on breakouts ---
[tasks.phase]
description = "ten thousand transitions decoded, zero invalid codes"
run = ".venv/bin/python scripts/capture_phase.py"

[tasks.link]
description = "frames deliver, ESP-NOW version matches the contract, radio-disabled image asserted"
run = ".venv/bin/python scripts/capture_link.py"

# --- Tier 3: the fabricated harness ---
[tasks.incoming]
description = "per-board continuity and shorts, before any board is powered"
run = ".venv/bin/python scripts/capture_incoming.py"

[tasks.noop]
description = "static load within 0.5 percent on both channels, all four edge sources present"
run = ".venv/bin/python scripts/capture_noop.py"

[tasks.negctl]
description = "busy-loop fit under 2 percent, and the radio-off transmit integral collapses"
run = ".venv/bin/python scripts/capture_negctl.py"

[tasks.gain]
description = "0.5 percent against the standard, 0.2 percent between channels, measured shunts recorded"
run = ".venv/bin/python scripts/capture_gain.py"

[tasks.timing]
description = "commanded pulse widths reproduced within 2 microseconds or 0.5 percent"
run = ".venv/bin/python scripts/capture_timing.py"

[tasks.bandwidth]
description = "duty cycle near 140 microseconds reproduced within 5 percent"
run = ".venv/bin/python scripts/capture_bandwidth.py"

[tasks.supply]
description = "supply excursion under 0.5 percent across a transmit burst"
run = ".venv/bin/python scripts/capture_supply.py"

